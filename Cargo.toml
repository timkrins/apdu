[package]
name = "apdu"
version = "0.1.0"
edition = "2024"
description = "ncdu-style disk usage browser that understands APFS copy-on-write clones"
license = "MIT"

[[bin]]
name = "apdu"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rayon = "1.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
zstd = { version = "0.13", features = ["zstdmt"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt", "net"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
